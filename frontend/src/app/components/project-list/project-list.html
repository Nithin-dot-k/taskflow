<h2>My Projects</h2>
@if (projects().length > 0) {
  <ul>
    @for (project of projects(); track project.id) {
      <li>
        <a [routerLink]="['/projects', project.id]">
          <h3>{{ project.title }}</h3>
        </a>
        <p>{{ project.description }}</p>
      </li>
    }
  </ul>
} @else {
  <p>No projects found. Create one!</p>
}
