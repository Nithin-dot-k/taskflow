<div class="create-project-container">
  <h2>Create a New Project</h2>
  <div>
    <label>Title:</label>
    <input [(ngModel)]="title" placeholder="Project title" />
  </div>
  <div>
    <label>Description:</label>
    <input [(ngModel)]="description" placeholder="Project description" />
  </div>
  <button (click)="onCreate()">Save Project</button>
</div>
